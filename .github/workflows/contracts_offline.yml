# Offline contracts tool: regenerate tools/contracts_offline/out/ and fail if it
# differs from the committed copy, then run the tool's tests.
# Pacti is installed only in this job; it is not a runtime dependency.
name: contracts-offline

on:
  push:
    paths:
      - "src/contracts/**"
      - "src/planning/**"
      - "tools/contracts_offline/**"
      - ".github/workflows/contracts_offline.yml"
  pull_request:
    paths:
      - "src/contracts/**"
      - "src/planning/**"
      - "tools/contracts_offline/**"
      - ".github/workflows/contracts_offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The pins in requirements.txt give byte-identical out/ on both.
        python-version: ["3.10", "3.11"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # out/ records no git commit ID (only a content hash of the inputs), so a
      # shallow checkout is enough and cherry-picks/squashes do not change out/.
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/contracts_offline/requirements.txt

      - name: Install the tool's pinned requirements
        run: python -m pip install -r tools/contracts_offline/requirements.txt

      - name: Regenerate out/
        run: python tools/contracts_offline/run.py

      - name: Fail if the regenerated out/ differs from the committed one
        run: |
          git status --porcelain --untracked-files=all -- tools/contracts_offline/out
          git diff --stat --exit-code -- tools/contracts_offline/out
          if [ -n "$(git status --porcelain --untracked-files=all -- tools/contracts_offline/out)" ]; then
            echo "::error::tools/contracts_offline/out is stale. Run 'python tools/contracts_offline/run.py' and commit out/."
            exit 1
          fi

      - name: Run the tool's tests
        run: python -m pytest -p no:cacheprovider -v tools/contracts_offline/tests
