name: core

# core: the default test suite (module smoke tests, requirements-only goldens,
#   the ROS 2 node import check) on every push and pull request, across
#   OS x Python x NumPy, with the core installed by `pip install -e ./contract_uav_core`.
# pacti-reproduction: the slow opt-in check that pacti 0.3.1 reproduces
#   docs/RESULTS.md section 1. Runs only when started by hand or on the weekly schedule.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"  # Mondays 04:23 UTC: pacti-reproduction only

permissions:
  contents: read

# A newer push to the same pull request cancels its superseded run. Runs from
# pushes (including to main), dispatch and schedule are never cancelled, so
# every main commit gets a completed run.
concurrency:
  group: core-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MPLBACKEND: Agg
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

defaults:
  run:
    shell: bash

jobs:
  core:
    if: github.event_name != 'schedule'
    name: core (${{ matrix.os }}, Python ${{ matrix.python }}, NumPy ${{ matrix.numpy }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11"]
        numpy: ["1.x", "2.x"]
        include:
          - numpy: "1.x"
            numpy-spec: "numpy==1.26.*"
          - numpy: "2.x"
            numpy-spec: "numpy>=2,<3"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            contract_uav_core/setup.py

      - name: Install contract_uav_core (editable) and requirements/test.txt with ${{ matrix.numpy-spec }}
        run: python -m pip install -e ./contract_uav_core -r requirements/test.txt "${{ matrix.numpy-spec }}"

      - name: Show versions
        run: |
          python --version
          python -m pip list

      # The editable install writes contract_uav_core/contract_uav_core.egg-info/
      # (gitignored), so compare against the tree as the install left it.
      - name: Record the working tree after the install
        run: git status --porcelain --ignored | tee ../status-before-tests.txt

      # Git Bash on the Windows runners may not ship GNU make; Chocolatey does.
      - name: Make sure GNU make is available (Windows)
        if: runner.os == 'Windows'
        run: command -v make || choco install make --no-progress -y

      - name: Test (make test)
        run: make test PYTHON=python

      - name: The tests leave the working tree as they found it
        run: |
          git status --porcelain --ignored | tee ../status-after-tests.txt
          diff ../status-before-tests.txt ../status-after-tests.txt

  pacti-reproduction:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    name: pacti reproduction (RESULTS.md section 1, slow)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            contract_uav_core/setup.py

      - name: Install contract_uav_core (editable), requirements/pacti.txt and requirements/test.txt
        run: python -m pip install -e ./contract_uav_core -r requirements/pacti.txt -r requirements/test.txt

      - name: Show versions and require pacti 0.3.1
        run: |
          python -m pip list
          python -c "import importlib.metadata as m; v = m.version('pacti'); print('pacti', v); assert v == '0.3.1', v"

      - name: Record the working tree after the install
        run: git status --porcelain --ignored | tee ../status-before-tests.txt

      - name: Test everything, slow tests included (make test-all)
        run: make test-all PYTHON=python

      - name: The tests leave the working tree as they found it
        run: |
          git status --porcelain --ignored | tee ../status-after-tests.txt
          diff ../status-before-tests.txt ../status-after-tests.txt
