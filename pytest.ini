# pytest configuration only. The core is the package in contract_uav_core/;
# install it first: python -m pip install -e ./contract_uav_core
#
# Default run (`make test` or `python -B -m pytest`): smoke + golden tests,
# excluding `slow` and `perf`. Run the slow pacti reproduction with
# `make test-pacti` (`-m slow`) and the 30-minute G1.4 run with `make test-perf`
# (`-m perf`); a later -m on the command line overrides the one below.
#
# `-p no:cacheprovider` stops pytest writing .pytest_cache/ into the working
# tree; the tests themselves run every script from a copy in pytest's temp dir.
# Only `make test` (and CI) leave no files at all: they set
# PYTHONDONTWRITEBYTECODE=1. Plain `python -m pytest` also writes (gitignored)
# tests/**/__pycache__/; use `python -B -m pytest` to avoid that.
[pytest]
minversion = 7.0
testpaths = tests
addopts = -ra --strict-markers -p no:cacheprovider -m "not slow and not perf"
xfail_strict = true
markers =
    slow: takes minutes; excluded by default, select with -m slow
    perf: the 30-simulated-minute G1.4 run (a few minutes of wall time); excluded by default, select with -m perf
    pacti: needs pacti installed (requirements/pacti.txt); skipped without it
    golden: compares benchmark output with a pinned file in tests/golden/
    smoke: runs a module's __main__ self-test and checks the exit code
