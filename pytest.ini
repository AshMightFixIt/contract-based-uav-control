# pytest configuration only; there is no package definition here yet.
#
# Default run (`make test` or `python -B -m pytest`): smoke + golden tests,
# excluding `slow`. Run the slow pacti reproduction with `make test-pacti`
# (`-m slow`); a later -m on the command line overrides the one below.
#
# `-p no:cacheprovider` stops pytest writing .pytest_cache/ into the working
# tree; the tests themselves run every script from a copy in pytest's temp dir.
# Only `make test` (and CI) leave no files at all: they set
# PYTHONDONTWRITEBYTECODE=1. Plain `python -m pytest` also writes (gitignored)
# tests/**/__pycache__/; use `python -B -m pytest` to avoid that.
[pytest]
minversion = 7.0
testpaths = tests
addopts = -ra --strict-markers -p no:cacheprovider -m "not slow"
xfail_strict = true
markers =
    slow: takes minutes; excluded by default, select with -m slow
    pacti: needs pacti installed (requirements-legacy.txt); skipped without it
    golden: compares benchmark output with a pinned file in tests/golden/
    smoke: runs a module's __main__ self-test and checks the exit code
